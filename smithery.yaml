# Smithery configuration for ECAC: DCTF WEB
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_ecac_dctf_web

name: ecac_dctf_web-mcp
displayName: "ECAC: DCTF WEB"
description: >
  ECAC: DCTF WEB, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/ecac_dctf_web-mcp
repository: https://github.com/mcp-dir/ecac_dctf_web-mcp

tags:
  - ecac_dctf_web
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_ecac_dctf_web

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_ecac_dctf_web/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
